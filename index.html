    /* =====================================================================
       CONTROLADOR DE RENDERIZADO Y PROGRESO SEGMENTADO
       ===================================================================== */

    function renderProgressSegments() {
      const current = state.currentSlide;
      const activeColor = getSlideAccent(current);

      progressSegmentsEl.innerHTML = Array.from({ length: TOTAL_SLIDES }, (_, idx) => {
        const isPassed = idx <= current;
        const isCurrent = idx === current;
        return `
          <button
            type="button"
            onclick="goToSlide(${idx})"
            role="tab"
            aria-selected="${isCurrent}"
            aria-label="Ir a diapositiva ${idx + 1}"
            class="group py-2 focus:outline-none flex items-center"
          >
            <span
              class="block w-full rounded-full transition-all duration-300 ${isCurrent ? 'h-[4px]' : 'h-[2.5px] group-hover:h-[4px]'}"
              style="background-color: ${isPassed ? activeColor : '#E4E1DA'}; opacity: ${isCurrent ? '1' : isPassed ? '0.62' : '1'};"
            ></span>
          </button>
        `;
      }).join('');
    }

    function renderCurrentSlide() {
      const idx = state.currentSlide;
      let html = '';

      if (idx === 0) {
        html = renderSlide1Intro();
      } else if (idx >= 1 && idx <= 8) {
        html = renderSlideProduct(PRODUCTS[idx - 1]);
      } else if (idx === 9) {
        html = renderSlide10Lineup();
      } else if (idx === 10) {
        html = renderSlide11Farmatodo();
      } else {
        html = renderSlide12Pricing();
      }

      stageEl.innerHTML = html;
      stageEl.scrollTop = 0;

      // Actualizar contador numérico y barra segmentada
      counterCurrentEl.textContent = String(idx + 1).padStart(2, '0');
      counterTotalEl.textContent = String(TOTAL_SLIDES).padStart(2, '0');
      renderProgressSegments();

      // Estado de botones de flecha
      btnPrev.disabled = idx === 0;
      btnNext.disabled = idx === TOTAL_SLIDES - 1;
    }

    // Acciones globales
    window.goToSlide = function (index) {
      if (index < 0 || index >= TOTAL_SLIDES) return;
      state.currentSlide = index;
      // Al cambiar a un producto, mostrar por defecto el envase y la pestaña de beneficios
      if (index >= 1 && index <= 8) {
        state.vesselView = 'vessel';
        state.detailTab = 'benefits';
      }
      renderCurrentSlide();
    };

    window.setVesselView = function (view) {
      state.vesselView = view;
      renderCurrentSlide();
    };

    window.setDetailTab = function (tab) {
      state.detailTab = tab;
      renderCurrentSlide();
    };

    window.setLineupFilter = function (filter) {
      state.lineupFilter = filter;
      renderCurrentSlide();
    };

    window.setPricingView = function (view) {
      state.pricingView = view;
      renderCurrentSlide();
    };

    // Eventos de botones del footer
    btnPrev.addEventListener('click', () => goToSlide(state.currentSlide - 1));
    btnNext.addEventListener('click', () => goToSlide(state.currentSlide + 1));

    // Soporte silencioso de teclado (flechas izquierda/derecha)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        goToSlide(state.currentSlide + 1);
      } else if (e.key === 'ArrowLeft') {
        goToSlide(state.currentSlide - 1);
      }
    });

    // Soporte silencioso de gestos táctiles (swipe horizontal en móvil)
    let touchStartX = 0;
    let touchStartY = 0;

    stageEl.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    stageEl.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0) {
          goToSlide(state.currentSlide + 1);
        } else {
          goToSlide(state.currentSlide - 1);
        }
      }
    }, { passive: true });

    // Inicializar presentación
    renderCurrentSlide();
  </script>
