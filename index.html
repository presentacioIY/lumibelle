    /**
     * Diapositiva 13: Precios Lumibelle (Tabla comparativa | Barras visuales)
     */
    function renderSlide12Pricing() {
      const maxVal = 48000;

      return `

              <button

                class="px-4 py-1.5 rounded-full text-xs font-medium transition-all ${
                  state.pricingView === 'table' ? 'bg-ink text-white shadow-sm' : 'text-muted hover:text-ink'
                }"
              >
                Tabla comparativa
              </button>
              <button
                type="button"
                onclick="setPricingView('bars')"
                class="px-4 py-1.5 rounded-full text-xs font-medium transition-all ${
                  state.pricingView === 'bars' ? 'bg-ink text-white shadow-sm' : 'text-muted hover:text-ink'
                }"
              >
                Barras visuales
              </button>
            </div>
          </div>

          ${state.pricingView === 'table' ? `
            <div class="bg-white border border-hairline rounded-3xl overflow-hidden shadow-[0_18px_48px_-28px_rgba(24,24,27,0.08)] fade-quick">
              <div class="overflow-x-auto soft-scroll">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b border-hairline bg-porcelain/90 text-[10.5px] font-semibold tracking-eyebrow uppercase text-muted">
                      <th class="py-3.5 px-4 sm:px-6">Producto</th>
                      <th class="py-3.5 px-4 text-right">Contenido</th>
                      <th class="py-3.5 px-4 text-right">Costo cotización</th>
                      <th class="py-3.5 px-4 text-right">Referente Farmatodo</th>
                      <th class="py-3.5 px-4 sm:px-6 text-right text-ink">PVP sugerido Lumibelle</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-hairline text-xs sm:text-sm">
                    ${PRODUCTS.map(p => `
                      <tr class="hover:bg-porcelain/50 transition-colors">
                        <td class="py-3 px-4 sm:px-6 font-medium text-ink">
                          <div class="flex items-center gap-2.5">
                            <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${p.accent};"></span>
                            <span>${p.name}</span>
                          </div>
                        </td>
                        <td class="py-3 px-4 text-right tabular-nums text-muted whitespace-nowrap">${p.volume}</td>
                        <td class="py-3 px-4 text-right tabular-nums text-ink whitespace-nowrap">${p.cost}</td>
                        <td class="py-3 px-4 text-right tabular-nums text-muted whitespace-nowrap">${p.refFarmatodo}</td>
                        <td class="py-3 px-4 sm:px-6 text-right tabular-nums font-semibold whitespace-nowrap">
                          <span class="px-2.5 py-1 rounded-full" style="background-color: ${p.tint}; color: ${p.accent};">
                            ${p.pvp}
                          </span>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          ` : `
            <div class="bg-white border border-hairline rounded-3xl p-5 sm:p-7 shadow-[0_18px_48px_-28px_rgba(24,24,27,0.08)] fade-quick">
              <!-- Leyenda de barras -->
              <div class="flex flex-wrap items-center gap-4 pb-4 mb-4 border-b border-hairline text-[11px] text-muted">
                <div class="flex items-center gap-1.5">
                  <span class="w-3 h-2 rounded-full bg-ink"></span>
                  <span>Costo cotización IH</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="w-3 h-2 rounded-full bg-[#4A89B8]"></span>
                  <span>PVP sugerido Lumibelle (color del activo)</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="w-3 h-2 rounded-full bg-[#D6D3CD]"></span>
                  <span>Referente Farmatodo</span>
                </div>
              </div>

              <!-- Barras comparativas en CSS puro -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
                ${PRODUCTS.map(p => {
                  const costPct = Math.round((p.costNum / maxVal) * 100);
                  const pvpPct = Math.round((p.pvpNum / maxVal) * 100);
                  const refPct = p.refFarmatodoNum ? Math.round((p.refFarmatodoNum / maxVal) * 100) : 0;

                  return `
                    <div class="space-y-1.5">
                      <div class="flex items-center justify-between text-xs">
                        <span class="font-semibold text-ink truncate pr-2">${p.shortName} <span class="font-normal text-muted">(${p.volume})</span></span>
                        <span class="font-semibold tabular-nums shrink-0" style="color: ${p.accent};">${p.pvp}</span>
                      </div>

                      <!-- Barra 1: Costo cotización -->
                      <div class="flex items-center gap-2">
                        <div class="flex-1 h-2 rounded-full bg-porcelain overflow-hidden">
                          <div class="h-full rounded-full bg-ink transition-all duration-500" style="width: ${costPct}%;"></div>
                        </div>
                        <span class="w-14 text-right text-[10px] tabular-nums text-muted">${p.cost}</span>

                      <!-- Barra 2: PVP Lumibelle -->
                      <div class="flex items-center gap-2">
                        <div class="flex-1 h-2 rounded-full bg-porcelain overflow-hidden">

                          }
                        </div>
                        <span class="w-14 text-right text-[10px] tabular-nums text-muted">${p.refFarmatodoNum ? '$' + p.refFarmatodoNum.toLocaleString('es-CO') : 'N/A'}</span>

    /**
     * Diapositiva 14: Cierre únicamente con la imagen
     */
    function renderSlide14Final() {
      return `
        <section class="w-full h-full flex items-center justify-center p-2 sm:p-4 slide-enter">
          <img
            src="${FINAL_SLIDE_SRC}"
            alt="LUMIBELLE Skincare — Cierre de presentación"
            class="max-w-full max-h-[calc(100dvh-5.5rem)] w-auto h-auto object-contain rounded-2xl shadow-[0_24px_60px_-32px_rgba(24,24,27,0.12)]"
          />
        </section>
      `;
    }

    /* =====================================================================
       CONTROLADOR DE RENDERIZADO Y PROGRESO SEGMENTADO
       ===================================================================== */

    function renderProgressSegments() {
      const current = state.currentSlide;
      const activeColor = getSlideAccent(current);

      progressSegmentsEl.innerHTML = Array.from({ length: TOTAL_SLIDES }, (_, idx) => {
        const isPassed = idx <= current;
        const isCurrent = idx === current;
        return `
          <button
            type="button"
            onclick="goToSlide(${idx})"
            role="tab"
            aria-selected="${isCurrent}"
            aria-label="Ir a diapositiva ${idx + 1}"
            class="group py-2 focus:outline-none flex items-center"
          >
            <span
              class="block w-full rounded-full transition-all duration-300 ${isCurrent ? 'h-[4px]' : 'h-[2.5px] group-hover:h-[4px]'}"
              style="background-color: ${isPassed ? activeColor : '#E4E1DA'}; opacity: ${isCurrent ? '1' : isPassed ? '0.62' : '1'};"
            ></span>
          </button>
        `;
      }).join('');
    }

    function renderCurrentSlide() {
      const idx = state.currentSlide;
      let html = '';

      if (idx === 0) {
        html = renderSlide1Cover();
      } else if (idx === 1) {
        html = renderSlide2Intro();
      } else if (idx >= 2 && idx <= 9) {
        html = renderSlideProduct(PRODUCTS[idx - 2]);
      } else if (idx === 10) {
        html = renderSlide10Lineup();
      } else if (idx === 11) {
        html = renderSlide11Farmatodo();
      } else if (idx === 12) {
        html = renderSlide12Pricing();
      } else {
        html = renderSlide14Final();
      }

      stageEl.innerHTML = html;
      stageEl.scrollTop = 0;

      // Actualizar contador numérico y barra segmentada
      counterCurrentEl.textContent = String(idx + 1).padStart(2, '0');
      counterTotalEl.textContent = String(TOTAL_SLIDES).padStart(2, '0');
      renderProgressSegments();

      // Estado de botones de flecha
      btnPrev.disabled = idx === 0;
      btnNext.disabled = idx === TOTAL_SLIDES - 1;
    }

    // Acciones globales
    window.goToSlide = function (index) {
      if (index < 0 || index >= TOTAL_SLIDES) return;
      state.currentSlide = index;
      // Al cambiar a un producto, mostrar por defecto el envase y la pestaña de beneficios
      if (index >= 2 && index <= 9) {
        state.vesselView = 'vessel';
        state.detailTab = 'benefits';
      }
      renderCurrentSlide();
    };

    window.setVesselView = function (view) {
      state.vesselView = view;
      renderCurrentSlide();
    };

    window.setDetailTab = function (tab) {
      state.detailTab = tab;
      renderCurrentSlide();
    };

    window.setLineupFilter = function (filter) {
      state.lineupFilter = filter;
      renderCurrentSlide();
    };

    window.setPricingView = function (view) {
      state.pricingView = view;
      renderCurrentSlide();
    };

    // Eventos de botones del footer
    btnPrev.addEventListener('click', () => goToSlide(state.currentSlide - 1));
    btnNext.addEventListener('click', () => goToSlide(state.currentSlide + 1));

    // Soporte silencioso de teclado (flechas izquierda/derecha)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        goToSlide(state.currentSlide + 1);
      } else if (e.key === 'ArrowLeft') {
        goToSlide(state.currentSlide - 1);
      }
    });

    // Soporte silencioso de gestos táctiles (swipe horizontal en móvil)
    let touchStartX = 0;
    let touchStartY = 0;

    stageEl.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    stageEl.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        if (dx < 0) {
          goToSlide(state.currentSlide + 1);
        } else {
          goToSlide(state.currentSlide - 1);
        }
      }
    }, { passive: true });

    // Inicializar presentación
    renderCurrentSlide();
  </script>
</body>
</html>
